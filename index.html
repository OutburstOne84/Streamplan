<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Streamplan OutburstOne</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <style>
        :root { 
            --bg-1: #f0f7ff; --bg-2: #c7d9ff; 
            --text-color: #1a2a40; --accent-blue: #3b82f6; --border-color: #93c5fd; 
            --section-bg: #ffffff; --date-bg: #e0efff; --badge-color: #2563eb; 
            --action-color: #1d4ed8; --live-red: #ff0000; --slot-border: #f0f4f8;
            --social-color: #1e3a8a;
        }

        [data-theme="dark"] {
            --bg-1: #0f172a; --bg-2: #1e293b; 
            --text-color: #f1f5f9; --accent-blue: #60a5fa; --border-color: #334155; 
            --section-bg: #1e293b; --date-bg: #334155; --badge-color: #3b82f6; 
            --action-color: #2563eb; --slot-border: #475569;
            --social-color: #f1f5f9;
        }

        body { 
            margin: 0; font-family: 'Segoe UI', sans-serif; 
            background: linear-gradient(180deg, var(--bg-1), var(--bg-2)); 
            min-height: 100vh; color: var(--text-color); padding-bottom: 50px; 
            transition: background 0.3s ease, color 0.3s ease;
        }
        
        header, main, footer { width: 95%; max-width: 850px; margin: auto; text-align: center; position: relative; }
        header { padding: 40px 0 20px; }

        /* THEME SLIDER */
        .theme-switch-wrapper { position: absolute; right: 0; top: 10px; display: flex; align-items: center; gap: 8px; }
        .theme-switch { display: inline-block; height: 20px; position: relative; width: 44px; }
        .theme-switch input { display:none; }
        .slider { background-color: #ccc; bottom: 0; cursor: pointer; left: 0; position: absolute; right: 0; top: 0; transition: .4s; border-radius: 34px; }
        .slider:before { background-color: white; bottom: 3px; content: ""; height: 14px; left: 4px; position: absolute; transition: .4s; width: 14px; border-radius: 50%; }
        input:checked + .slider { background-color: var(--accent-blue); }
        input:checked + .slider:before { transform: translateX(22px); }

        /* LIVE BADGE */
        .live-tag-badge {
            background: var(--live-red); color: white; padding: 8px 12px; border-radius: 12px;
            font-weight: 900; font-size: 13px; display: inline-flex; flex-direction: column; 
            align-items: center; gap: 5px; margin-top: 15px; text-decoration: none; 
            box-shadow: 0 0 20px rgba(255, 0, 0, 0.4); animation: pulse-l 1.5s infinite; border: 2px solid white;
        }
        @keyframes pulse-l { 0% { transform: scale(1); } 70% { transform: scale(1.05); } 100% { transform: scale(1); } }
        .dot { width: 8px; height: 8px; background: white; border-radius: 50%; }

        h1 { font-size: 45px; margin: 0; }
        h1 span { display: block; font-size: 28px; color: var(--accent-blue); font-weight: normal; }
        #status-container { margin-top: 15px; font-size: 16px; font-weight: bold; }
        #week-range { background: var(--badge-color); color: white; padding: 5px 15px; border-radius: 8px; display: inline-block; margin-left: 5px; }

        /* CONTENT */
        section { display: flex; margin-top: 30px; border: 2px solid var(--border-color); border-radius: 20px; background-color: var(--section-bg); overflow: hidden; text-align: left; box-shadow: 0 6px 15px rgba(0,0,0,0.1); }
        .past-day { opacity: 0.5; filter: grayscale(80%); transition: 0.3s; }
        .past-day:hover { opacity: 0.85; filter: grayscale(0%); }
        .today { box-shadow: 0 0 35px rgba(59, 130, 246, 0.3); border: 3px solid var(--accent-blue); transform: scale(1.02); }
        .weekday { padding: 20px; width: 150px; background-color: var(--date-bg); border-right: 2px solid var(--border-color); display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; flex-shrink: 0; }
        .weekday h3 span { display: block; font-size: 24px; font-weight: 900; }
        .datum-text { font-size: 15px; font-weight: bold; color: var(--accent-blue); }
        .slots { flex: 1; display: flex; flex-direction: column; justify-content: center; min-height: 100px; }
        .slot { display: flex; align-items: center; padding: 20px; border-bottom: 1px solid var(--slot-border); }
        .slot:last-child { border-bottom: none; }
        .slot img { width: 65px; height: 85px; object-fit: cover; border-radius: 8px; margin-right: 20px; border: 1px solid var(--border-color); }
        .time-badge { background: var(--badge-color); color: white; padding: 3px 10px; border-radius: 8px; font-size: 13px; font-weight: bold; margin-bottom: 5px; display: inline-block; }
        .event-title { margin: 0; font-weight: 800; font-size: 18px; }
        .guest-text { color: var(--accent-blue); font-size: 13px; font-weight: bold; margin-top: 5px; }
        .btn-link { background: var(--action-color); color: white; text-decoration: none; padding: 6px 14px; border-radius: 6px; font-size: 11px; font-weight: bold; margin-top: 10px; display: inline-block; }
        .offday-container { padding: 40px; text-align: center; width: 100%; font-weight: 900; color: #64748b; font-size: 22px; }

        /* SOCIAL MEDIA & LEGAL FOOTER */
        footer { margin-top: 50px; padding: 20px 0 40px; border-top: 1px solid var(--border-color); }
        .social-icons { display: flex; justify-content: center; gap: 30px; margin-bottom: 20px; }
        .social-icons a { color: var(--social-color); font-size: 28px; transition: transform 0.2s, color 0.2s; text-decoration: none; }
        .social-icons a:hover { transform: scale(1.2); color: var(--accent-blue); }
        
        .legal-link { display: inline-flex; align-items: center; gap: 8px; color: var(--social-color); text-decoration: none; font-size: 14px; font-weight: bold; opacity: 0.8; transition: opacity 0.2s; }
        .legal-link:hover { opacity: 1; text-decoration: underline; }

        @media(max-width: 650px) { section { flex-direction: column; } .weekday { width: 100%; border-right: none; border-bottom: 2px solid var(--border-color); } }
    </style>
</head>
<body>

<header>
    <div class="theme-switch-wrapper">
        <span>☀️</span>
        <label class="theme-switch" for="checkbox">
            <input type="checkbox" id="checkbox" />
            <div class="slider"></div>
        </label>
        <span>🌙</span>
    </div>
    <h1><span>OutburstOne</span> Streamplan</h1>
    <div id="status-container">
        Aktueller Wochenplan: <span id="week-range">Lädt...</span>
    </div>
</header>

<main id="plan-container"></main>

<footer>
    <div class="social-icons">
        <a href="https://twitch.tv/outburstone" target="_blank" title="Twitch"><i class="fab fa-twitch"></i></a>
        <a href="https://instagram.com/DEIN_NAME" target="_blank" title="Instagram"><i class="fab fa-instagram"></i></a>
        <a href="https://tiktok.com/@DEIN_NAME" target="_blank" title="TikTok"><i class="fab fa-tiktok"></i></a>
        <a href="https://x.com/DEIN_NAME" target="_blank" title="X (Twitter)"><i class="fab fa-x-twitter"></i></a>
        <a href="https://youtube.com/@DEIN_NAME" target="_blank" title="YouTube"><i class="fab fa-youtube"></i></a>
    </div>
    <div style="margin-top: 10px;">
        <a href="DEIN_LINK" target="_blank" class="legal-link">
            <i class="fas fa-file-signature"></i> Impressum/Datenschutz
        </a>
    </div>
</footer>

<script>
    // THEME SWITCH
    const toggleSwitch = document.querySelector('.theme-switch input[type="checkbox"]');
    const currentTheme = localStorage.getItem('theme');
    if (currentTheme) {
        document.documentElement.setAttribute('data-theme', currentTheme);
        if (currentTheme === 'dark') { toggleSwitch.checked = true; }
    }
    toggleSwitch.addEventListener('change', (e) => {
        const theme = e.target.checked ? 'dark' : 'light';
        document.documentElement.setAttribute('data-theme', theme);
        localStorage.setItem('theme', theme);
    });

    // DATE LOGIC
    function setWeekDisplay() {
        const curr = new Date();
        const day = curr.getDay();
        const diff = curr.getDate() - day + (day === 0 ? -6 : 1); 
        const firstday = new Date(new Date().setDate(diff));
        const lastday = new Date(new Date().setDate(diff + 6));
        const options = { day: '2-digit', month: '2-digit', year: 'numeric' };
        document.getElementById('week-range').innerText = `${firstday.toLocaleDateString('de-DE', options)} - ${lastday.toLocaleDateString('de-DE', options)}`;
    }

    const SHEET_ID = '1Tqh44T0aVLwoxvql2yN5NRnwAUxtPi_LAYQvV9HWu5U'; 
    const url = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:csv&sheet=Plan`;

    setWeekDisplay();

    fetch(url).then(res => res.text()).then(data => {
        const rows = data.split('\n').slice(1);
        const container = document.getElementById('plan-container');
        container.innerHTML = '';
        const heute = new Date(); heute.setHours(0,0,0,0);
        let lastDate = "";

        rows.forEach(row => {
            const cols = row.match(/(".*?"|[^",\s]+)(?=\s*,|\s*$)/g) || [];
            const clean = cols.map(c => c.replace(/^"|"$/g, '').trim());
            if (clean.length < 4) return;
            const [tag, datumStr, zeit, titel, spielID, statusRaw, gaeste, link] = clean;
            const status = statusRaw ? statusRaw.toLowerCase() : "";

            if (datumStr !== lastDate) {
                const parts = datumStr.split('.');
                const termin = new Date(parts[2], parts[1]-1, parts[0]); termin.setHours(0,0,0,0);
                const section = document.createElement('section');
                if (termin.getTime() === heute.getTime()) section.className = 'today';
                else if (termin.getTime() < heute.getTime()) section.className = 'past-day';
                section.innerHTML = `<div class="weekday"><h3><span>${tag}</span><div class="datum-text">${datumStr}</div></h3><div class="status-area"></div></div><div class="slots"></div>`;
                container.appendChild(section);
                lastDate = datumStr;
            }

            const currentSection = container.lastElementChild;
            const slotsDiv = currentSection.querySelector('.slots');
            const statusArea = currentSection.querySelector('.status-area');

            if (status === 'live') {
                statusArea.innerHTML = `<a href="https://twitch.tv/outburstone" target="_blank" class="live-tag-badge"><div class="dot"></div><span>JETZT LIVE<br>AUF TWITCH</span></a>`;
            }

            if (status === 'offday') {
                slotsDiv.innerHTML = `<div class="offday-container">❄️ STREAMFREI ❄️</div>`;
            } else if (!slotsDiv.innerHTML.includes('STREAMFREI')) {
                const linkHTML = (link && link !== 'null' && link !== '') ? `<a href="${link}" target="_blank" class="btn-link">📺 VIDEO ANSEHEN</a>` : '';
                const guestHTML = (gaeste && gaeste !== 'null' && gaeste !== '') ? `<div class="guest-text">👥 Heute mit ${gaeste}</div>` : '';
                const finalImgID = (spielID && !isNaN(spielID)) ? spielID : '509658';
                slotsDiv.insertAdjacentHTML('beforeend', `<div class="slot"><img src="https://static-cdn.jtvnw.net/ttv-boxart/${finalImgID}-144x192.jpg"><div class="slot-body"><div class="time-badge">${zeit} Uhr</div><p class="event-title">${titel}</p>${guestHTML} ${linkHTML}</div></div>`);
            }
        });
    });
</script>
</body>
</html>
