<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Streamplan OutburstOne</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <style>
        :root { 
            --bg-1: #f0f7ff; --bg-2: #c7d9ff; --text-color: #1a2a40; --accent-blue: #3b82f6; 
            --border-color: #93c5fd; --section-bg: #ffffff; --date-bg: #e0efff; 
            --badge-color: #2563eb; --action-color: #1d4ed8; --slot-border: #f0f4f8;
            --social-color: #1e3a8a; 
            --twitch-color: #9146FF; --youtube-color: #FF0000; --kick-color: #53fc18;
        }
        [data-theme="dark"] {
            --bg-1: #0f172a; --bg-2: #1e293b; --text-color: #f1f5f9; --accent-blue: #60a5fa; 
            --border-color: #334155; --section-bg: #1e293b; --date-bg: #334155; 
            --badge-color: #3b82f6; --social-color: #f1f5f9;
        }
        body { margin: 0; font-family: 'Segoe UI', sans-serif; background: linear-gradient(180deg, var(--bg-1), var(--bg-2)); min-height: 100vh; color: var(--text-color); padding-bottom: 50px; }
        header, main, footer { width: 95%; max-width: 850px; margin: auto; text-align: center; position: relative; }
        header { padding: 60px 0 30px; }
        h1 { font-size: 48px; margin: 0; font-weight: 900; }
        h1 span { display: block; font-size: 24px; color: var(--accent-blue); text-transform: uppercase; letter-spacing: 2px; }
        #week-range { background: var(--badge-color); color: white; padding: 6px 16px; border-radius: 10px; display: inline-block; margin-top: 10px; font-weight: bold; }
        
        section { display: flex; margin-top: 35px; border: 2px solid var(--border-color); border-radius: 24px; background-color: var(--section-bg); overflow: hidden; text-align: left; box-shadow: 0 10px 25px rgba(0,0,0,0.05); }
        .past-day { opacity: 0.4; filter: grayscale(100%); transition: 0.3s; }
        .past-day:hover { opacity: 1; filter: grayscale(0%); }
        .today { border: 3px solid var(--accent-blue); transform: scale(1.02); }

        .weekday { padding: 25px; width: 140px; background-color: var(--date-bg); border-right: 2px solid var(--border-color); display: flex; flex-direction: column; align-items: center; justify-content: center; flex-shrink: 0; }
        .weekday h3 span { display: block; font-size: 26px; font-weight: 900; }
        
        .slots { flex: 1; display: flex; flex-direction: column; }
        .slot { display: flex; align-items: center; padding: 20px; border-bottom: 1px solid var(--slot-border); }
        .slot img { width: 70px; height: 95px; object-fit: cover; border-radius: 10px; margin-right: 20px; background: #ddd; }
        
        .event-title { margin: 5px 0; font-weight: 800; font-size: 19px; }
        .time-badge { background: var(--badge-color); color: white; padding: 4px 10px; border-radius: 6px; font-size: 13px; font-weight: bold; }

        .live-tag-badge { background: var(--twitch-color); color: white; padding: 8px 12px; border-radius: 10px; font-weight: 900; font-size: 11px; text-decoration: none; margin-top: 10px; display: inline-block; animation: pulse 1.5s infinite; }
        @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.05); } 100% { transform: scale(1); } }

        footer { margin-top: 50px; padding: 30px; border-top: 2px solid var(--border-color); }
        .social-icons a { color: var(--social-color); font-size: 24px; margin: 0 10px; text-decoration: none; opacity: 0.8; }
        .social-icons a:hover { opacity: 1; color: var(--accent-blue); }
        .legal-link { display: block; margin-top: 20px; font-size: 12px; opacity: 0.6; text-decoration: none; color: var(--text-color); font-weight: bold; }
    </style>
</head>
<body>

<header>
    <h1><span>OutburstOne</span> STREAMPLAN</h1>
    <div id="week-range">Lädt Zeitraum...</div>
</header>

<main id="plan-container"></main>

<footer>
    <div class="social-icons">
        <a href="https://twitch.tv/outburstone"><i class="fab fa-twitch"></i></a>
        <a href="https://youtube.com"><i class="fab fa-youtube"></i></a>
        <a href="https://instagram.com"><i class="fab fa-instagram"></i></a>
    </div>
    <a href="#" class="legal-link">IMPRESSUM & DATENSCHUTZ</a>
</footer>

<script>
    const SHEET_ID = '1Tqh44T0aVLwoxvql2yN5NRnwAUxtPi_LAYQvV9HWu5U';
    const url = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:csv&sheet=Plan`;

    fetch(url).then(res => res.text()).then(data => {
        const rows = data.split('\n').slice(1);
        const container = document.getElementById('plan-container');
        container.innerHTML = '';
        const heute = new Date(); heute.setHours(0,0,0,0);
        let allDates = [];
        let lastDate = "";

        rows.forEach(row => {
            const cols = row.match(/(".*?"|[^",\s]+)(?=\s*,|\s*$)/g) || [];
            const clean = cols.map(c => c.replace(/^"|"$/g, '').trim());
            if (clean.length < 4) return;
            const [tag, datumStr, zeit, titel, spielID, statusRaw] = clean;
            
            if (datumStr) {
                const p = datumStr.split('.');
                allDates.push(new Date(p[2], p[1]-1, p[0]));
            }

            if (datumStr !== lastDate) {
                const section = document.createElement('section');
                const p = datumStr.split('.');
                const termin = new Date(p[2], p[1]-1, p[0]);
                if (termin.getTime() === heute.getTime()) section.className = 'today';
                else if (termin.getTime() < heute.getTime()) section.className = 'past-day';
                
                section.innerHTML = `<div class="weekday"><h3><span>${tag}</span><br><small>${datumStr}</small></h3><div class="status-area"></div></div><div class="slots"></div>`;
                container.appendChild(section);
                lastDate = datumStr;
            }

            const slotsDiv = container.lastElementChild.querySelector('.slots');
            const statusArea = container.lastElementChild.querySelector('.status-area');
            const status = statusRaw ? statusRaw.toLowerCase() : "";

            if (status === 'live') {
                statusArea.innerHTML = `<a href="https://twitch.tv/outburstone" class="live-tag-badge">🔴 JETZT LIVE</a>`;
            }

            if (status === 'offday') {
                slotsDiv.innerHTML = `<div style="padding:40px; text-align:center; font-weight:bold; color:#94a3b8;">❄️ STREAMFREI</div>`;
            } else {
                // BILD-LOGIK
                let imgSource;
                let cleanID = spielID.replace(/["']/g, "").trim();
                
                if (cleanID.startsWith('http')) {
                    imgSource = cleanID;
                } else {
                    const id = (cleanID && !isNaN(cleanID)) ? cleanID : '509658';
                    imgSource = `https://static-cdn.jtvnw.net/ttv-boxart/${id}-144x192.jpg`;
                }

                slotsDiv.insertAdjacentHTML('beforeend', `
                    <div class="slot">
                        <img src="${imgSource}" crossorigin="anonymous" referrerpolicy="no-referrer" onerror="this.src='https://static-cdn.jtvnw.net/ttv-boxart/509658-144x192.jpg';">
                        <div class="slot-info">
                            <span class="time-badge">${zeit} Uhr</span>
                            <p class="event-title">${titel}</p>
                        </div>
                    </div>`);
            }
        });

        if (allDates.length > 0) {
            allDates.sort((a,b) => a-b);
            document.getElementById('week-range').innerText = `${allDates[0].toLocaleDateString('de-DE')} - ${allDates[allDates.length-1].toLocaleDateString('de-DE')}`;
        }
    });
</script>
</body>
</html>
