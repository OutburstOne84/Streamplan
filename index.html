<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Streamplan OutburstOne</title>
    <style>
        :root { 
            --background-gradient-1: #f0f7ff; --background-gradient-2: #c7d9ff; 
            --text-color: #1a2a40; --accent-blue: #3b82f6; --border-color: #93c5fd; 
            --date-bg: #e0efff; --badge-color: #2563eb; --action-color: #1d4ed8;
            --live-red: #ff0000;
        }

        body { margin: 0; font-family: 'Segoe UI', sans-serif; background: linear-gradient(180deg, var(--background-gradient-1), var(--background-gradient-2)); min-height: 100vh; color: var(--text-color); padding-bottom: 50px; }
        header, main { width: 95%; max-width: 850px; margin: auto; text-align: center; }
        header { padding: 30px 0; }

        /* Vergrößerter Live-Badge direkt im Tag */
        .live-tag-badge {
            background: var(--live-red);
            color: white;
            padding: 8px 16px;
            border-radius: 12px;
            font-weight: 900;
            font-size: 14px; /* Größerer Text */
            display: inline-flex;
            flex-direction: column; /* Text untereinander für bessere Lesbarkeit im schmalen Feld */
            align-items: center;
            justify-content: center;
            gap: 5px;
            margin-top: 15px;
            text-decoration: none;
            box-shadow: 0 0 20px rgba(255, 0, 0, 0.5);
            animation: pulse-large 1.5s infinite;
            border: 2px solid white;
            line-height: 1.2;
        }

        @keyframes pulse-large {
            0% { transform: scale(1); box-shadow: 0 0 0 0 rgba(255, 0, 0, 0.7); }
            70% { transform: scale(1.08); box-shadow: 0 0 0 10px rgba(255, 0, 0, 0); }
            100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(255, 0, 0, 0); }
        }

        .dot { width: 10px; height: 10px; background: white; border-radius: 50%; box-shadow: 0 0 5px white; }
        
        h1 { font-size: 45px; color: #1a2a40; margin: 0; }
        h1 span { display: block; font-size: 28px; color: var(--accent-blue); font-weight: normal; }

        #status-container { margin-top: 15px; font-size: 16px; font-weight: bold; }
        #week-range { background: var(--badge-color); color: white; padding: 5px 15px; border-radius: 8px; display: inline-block; margin-left: 5px; }

        section { display: flex; margin-top: 30px; border: 2px solid var(--border-color); border-radius: 20px; background-color: white; overflow: hidden; text-align: left; box-shadow: 0 6px 15px rgba(0,0,0,0.05); }
        
        .past-day { opacity: 0.5; filter: grayscale(80%); transition: 0.3s; }
        .past-day:hover { opacity: 0.85; filter: grayscale(0%); }

        .today { box-shadow: 0 0 35px rgba(59, 130, 246, 0.3); border: 3px solid var(--accent-blue); transform: scale(1.02); }

        .weekday { padding: 20px; width: 150px; background-color: var(--date-bg); border-right: 2px solid var(--border-color); display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; flex-shrink: 0; }
        .weekday h3 span { display: block; font-size: 24px; font-weight: 900; }
        .datum-text { font-size: 15px; font-weight: bold; color: var(--accent-blue); }

        .slots { flex: 1; display: flex; flex-direction: column; justify-content: center; min-height: 100px; }
        .slot { display: flex; align-items: center; padding: 20px; border-bottom: 1px solid #f0f4f8; }
        .slot:last-child { border-bottom: none; }
        .slot img { width: 65px; height: 85px; object-fit: cover; border-radius: 8px; margin-right: 20px; border: 1px solid #dbeafe; }
        
        .slot-body { flex: 1; }
        .time-badge { background: var(--badge-color); color: white; padding: 3px 10px; border-radius: 8px; font-size: 13px; font-weight: bold; margin-bottom: 5px; display: inline-block; }
        .event-title { margin: 0; font-weight: 800; font-size: 18px; color: #1e3a8a; }
        
        .btn-link { background: var(--action-color); color: white; text-decoration: none; padding: 6px 14px; border-radius: 6px; font-size: 11px; font-weight: bold; margin-top: 10px; display: inline-block; }

        .offday-container { padding: 40px; text-align: center; width: 100%; font-weight: 900; color: #64748b; font-size: 22px; background-color: #f8fafc; }

        @media(max-width: 650px) { section { flex-direction: column; } .weekday { width: 100%; border-right: none; border-bottom: 2px solid var(--border-color); } }
    </style>
</head>
<body>

<header>
    <h1><span>OutburstOne</span> Streamplan</h1>
    <div id="status-container">
        Aktueller Wochenplan: <span id="week-range">Lädt...</span>
    </div>
</header>

<main id="plan-container"></main>

<script>
    function setWeekDisplay() {
        const curr = new Date();
        const day = curr.getDay();
        const diff = curr.getDate() - day + (day === 0 ? -6 : 1); 
        const firstday = new Date(new Date().setDate(diff));
        const lastday = new Date(new Date().setDate(diff + 6));
        const options = { day: '2-digit', month: '2-digit', year: 'numeric' };
        document.getElementById('week-range').innerText = `${firstday.toLocaleDateString('de-DE', options)} - ${lastday.toLocaleDateString('de-DE', options)}`;
    }

    const SHEET_ID = '1Tqh44T0aVLwoxvql2yN5NRnwAUxtPi_LAYQvV9HWu5U'; 
    const url = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:csv&sheet=Plan`;

    setWeekDisplay();

    fetch(url).then(res => res.text()).then(data => {
        const rows = data.split('\n').slice(1);
        const container = document.getElementById('plan-container');
        container.innerHTML = '';
        const heute = new Date(); heute.setHours(0,0,0,0);
        let lastDate = "";
        let currentSlotsDiv = null;
        let currentWeekdayDiv = null;

        rows.forEach(row => {
            const cols = row.match(/(".*?"|[^",\s]+)(?=\s*,|\s*$)/g) || [];
            const clean = cols.map(c => c.replace(/^"|"$/g, '').trim());
            if (clean.length < 4) return;

            const [tag, datumStr, zeit, titel, spielID, statusRaw, gaeste, link] = clean;
            const status = statusRaw ? statusRaw.toLowerCase() : "";

            if (datumStr !== lastDate) {
                const parts = datumStr.split('.');
                const termin = new Date(parts[2], parts[1]-1, parts[0]); termin.setHours(0,0,0,0);
                const section = document.createElement('section');
                
                if (termin.getTime() === heute.getTime()) section.className = 'today';
                else if (termin.getTime() < heute.getTime()) section.className = 'past-day';

                section.innerHTML = `
                    <div class="weekday">
                        <h3><span>${tag}</span><div class="datum-text">${datumStr}</div></h3>
                        <div class="status-area"></div>
                    </div>
                    <div class="slots"></div>`;
                
                container.appendChild(section);
                currentSlotsDiv = section.querySelector('.slots');
                currentWeekdayDiv = section.querySelector('.status-area');
                lastDate = datumStr;
            }

            if (status === 'live') {
                currentWeekdayDiv.innerHTML = `
                    <a href="https://twitch.tv/outburstone" target="_blank" class="live-tag-badge">
                        <div class="dot"></div>
                        <span>JETZT LIVE<br>AUF TWITCH</span>
                    </a>`;
            }

            if (status === 'offday') {
                currentSlotsDiv.innerHTML = `<div class="offday-container">❄️ STREAMFREI ❄️</div>`;
            } else if (!currentSlotsDiv.innerHTML.includes('STREAMFREI')) {
                const linkHTML = (link && link !== 'null' && link !== '') ? `<a href="${link}" target="_blank" class="btn-link">📺 VIDEO ANSEHEN</a>` : '';
                const guestHTML = (gaeste && gaeste !== 'null' && gaeste !== '') ? `<div style="color:var(--accent-blue); font-size:13px; font-weight:bold; margin-top:5px;">👥 ${gaeste}</div>` : '';
                const finalImgID = (spielID && !isNaN(spielID)) ? spielID : '509658';
                
                const slotHTML = `
                    <div class="slot">
                        <img src="https://static-cdn.jtvnw.net/ttv-boxart/${finalImgID}-144x192.jpg">
                        <div class="slot-body">
                            <div class="time-badge">${zeit} Uhr</div>
                            <p class="event-title">${titel}</p>
                            ${guestHTML}
                            ${linkHTML}
                        </div>
                    </div>`;
                currentSlotsDiv.insertAdjacentHTML('beforeend', slotHTML);
            }
        });
    });
</script>
</body>
</html>
