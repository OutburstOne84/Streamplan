<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Streamplan OutburstOne</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <style>
        :root { 
            --bg-1: #f0f7ff; --bg-2: #c7d9ff; --text-color: #1a2a40; --accent-blue: #3b82f6; 
            --border-color: #93c5fd; --section-bg: #ffffff; --date-bg: #e0efff; 
            --badge-color: #2563eb; --action-color: #1d4ed8; --slot-border: #f0f4f8;
            --social-color: #1e3a8a; 
            --twitch-color: #9146FF; --youtube-color: #FF0000; --kick-color: #53fc18;
            --multi-gradient: linear-gradient(90deg, #9146FF, #FF0000, #53fc18);
        }

        [data-theme="dark"] {
            --bg-1: #0f172a; --bg-2: #1e293b; --text-color: #f1f5f9; --accent-blue: #60a5fa; 
            --border-color: #334155; --section-bg: #1e293b; --date-bg: #334155; 
            --badge-color: #3b82f6; --action-color: #2563eb; --slot-border: #475569; --social-color: #f1f5f9;
        }

        body { margin: 0; font-family: 'Segoe UI', sans-serif; background: linear-gradient(180deg, var(--bg-1), var(--bg-2)); min-height: 100vh; color: var(--text-color); padding-bottom: 50px; transition: 0.3s; }
        header, main, footer { width: 95%; max-width: 850px; margin: auto; text-align: center; position: relative; }
        
        /* HEADER STYLING */
        header { padding: 60px 0 30px; }
        h1 { font-size: 48px; margin: 0; font-weight: 900; letter-spacing: -1px; }
        h1 span { display: block; font-size: 24px; color: var(--accent-blue); font-weight: 600; text-transform: uppercase; letter-spacing: 2px; margin-bottom: 5px; }
        
        #status-container { margin-top: 20px; font-size: 18px; font-weight: 700; color: var(--text-color); }
        #week-range { background: var(--badge-color); color: white; padding: 6px 16px; border-radius: 10px; display: inline-block; margin-left: 8px; box-shadow: 0 4px 10px rgba(37, 99, 235, 0.2); }

        /* THEME SLIDER */
        .theme-switch-wrapper { position: absolute; right: 0; top: 20px; display: flex; align-items: center; gap: 10px; font-size: 14px; }
        .theme-switch { display: inline-block; height: 24px; position: relative; width: 48px; }
        .theme-switch input { display:none; }
        .slider { background-color: #cbd5e1; bottom: 0; cursor: pointer; left: 0; position: absolute; right: 0; top: 0; transition: .4s; border-radius: 34px; }
        .slider:before { background-color: white; bottom: 4px; content: ""; height: 16px; left: 4px; position: absolute; transition: .4s; width: 16px; border-radius: 50%; }
        input:checked + .slider { background-color: var(--accent-blue); }
        input:checked + .slider:before { transform: translateX(24px); }

        /* LIVE BADGES */
        .live-tag-badge {
            color: white; padding: 10px 16px; border-radius: 14px; font-weight: 900; font-size: 13px; 
            display: inline-flex; flex-direction: column; align-items: center; gap: 5px; 
            margin-top: 15px; text-decoration: none; cursor: pointer; border: 2px solid rgba(255,255,255,0.8);
            animation: pulse-l 1.5s infinite; text-align: center; box-shadow: 0 6px 20px rgba(0,0,0,0.15);
        }
        @keyframes pulse-l { 0% { transform: scale(1); } 70% { transform: scale(1.05); } 100% { transform: scale(1); } }
        .dot { width: 8px; height: 8px; background: white; border-radius: 50%; }

        /* SECTIONS & EFFECTS */
        section { 
            display: flex; margin-top: 35px; border: 2px solid var(--border-color); border-radius: 24px; 
            background-color: var(--section-bg); overflow: hidden; text-align: left; 
            box-shadow: 0 10px 25px rgba(0,0,0,0.05); transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        .past-day { opacity: 0.5; filter: grayscale(80%); }
        .past-day:hover { opacity: 0.9; filter: grayscale(0%); transform: translateY(-3px); }
        .today { box-shadow: 0 0 40px rgba(59, 130, 246, 0.25); border: 3px solid var(--accent-blue); transform: scale(1.02); z-index: 5; }

        .weekday { padding: 25px; width: 140px; background-color: var(--date-bg); border-right: 2px solid var(--border-color); display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; flex-shrink: 0; }
        .weekday h3 span { display: block; font-size: 26px; font-weight: 900; line-height: 1; margin-bottom: 5px; }
        .slots { flex: 1; display: flex; flex-direction: column; justify-content: center; min-height: 120px; }
        .slot { display: flex; align-items: center; padding: 25px; border-bottom: 1px solid var(--slot-border); }
        .slot:last-child { border-bottom: none; }
        .slot img { width: 70px; height: 95px; object-fit: cover; border-radius: 12px; margin-right: 25px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); }
        .time-badge { background: var(--badge-color); color: white; padding: 4px 12px; border-radius: 8px; font-size: 14px; font-weight: 800; margin-bottom: 8px; display: inline-block; }
        .event-title { margin: 0; font-weight: 800; font-size: 20px; line-height: 1.2; }

        /* MODAL */
        .modal { display: none; position: fixed; z-index: 2000; left: 0; top: 0; width: 100%; height: 100%; background: rgba(15, 23, 42, 0.9); backdrop-filter: blur(8px); }
        .modal-content { background: var(--section-bg); margin: 12% auto; padding: 40px; border-radius: 30px; width: 85%; max-width: 380px; text-align: center; position: relative; box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5); }
        .modal-btns { display: flex; flex-direction: column; gap: 15px; margin-top: 25px; }
        .choice-btn { display: none; padding: 16px; border-radius: 16px; text-decoration: none; color: white; font-weight: 800; font-size: 18px; align-items: center; justify-content: center; gap: 12px; transition: 0.3s; }
        .choice-btn.tw { background: var(--twitch-color); }
        .choice-btn.yt { background: var(--youtube-color); }
        .choice-btn.ki { background: var(--kick-color); color: #000; }
        .choice-btn:hover { transform: scale(1.05); filter: brightness(1.1); }
        .close-modal { position: absolute; top: 15px; right: 20px; font-size: 28px; cursor: pointer; opacity: 0.5; }

        /* FOOTER */
        footer { margin-top: 60px; padding: 30px 0 50px; border-top: 2px solid var(--border-color); }
        .social-icons { display: flex; justify-content: center; gap: 30px; margin-bottom: 25px; }
        .social-icons a { color: var(--social-color); font-size: 28px; transition: 0.3s; opacity: 0.8; }
        .social-icons a:hover { transform: translateY(-5px); color: var(--accent-blue); opacity: 1; }
        .legal-link { color: var(--social-color); text-decoration: none; font-size: 14px; font-weight: 700; opacity: 0.6; transition: 0.2s; }
        .legal-link:hover { opacity: 1; text-decoration: underline; }

        @media(max-width: 650px) { 
            header { padding: 40px 0 20px; }
            h1 { font-size: 36px; }
            section { flex-direction: column; } 
            .weekday { width: 100%; border-right: none; border-bottom: 2px solid var(--border-color); padding: 15px; } 
        }
    </style>
</head>
<body>

<header>
    <div class="theme-switch-wrapper">
        <span>☀️</span>
        <label class="theme-switch" for="checkbox"><input type="checkbox" id="checkbox" /><div class="slider"></div></label>
        <span>🌙</span>
    </div>
    <h1><span>OutburstOne</span> STREAMPLAN</h1>
    <div id="status-container">
        Aktueller Wochenplan: <span id="week-range">Lädt...</span>
    </div>
</header>

<main id="plan-container"></main>

<div id="multiModal" class="modal">
    <div class="modal-content">
        <span class="close-modal" onclick="closeModal()">&times;</span>
        <h2 style="margin-top:0; font-weight: 900;">LIVE WÄHLEN</h2>
        <div class="modal-btns">
            <a id="m-twitch" href="https://twitch.tv/outburstone" target="_blank" class="choice-btn tw"><i class="fab fa-twitch"></i> Twitch</a>
            <a id="m-youtube" href="#" target="_blank" class="choice-btn yt"><i class="fab fa-youtube"></i> YouTube</a>
            <a id="m-kick" href="https://kick.com/outburstone" target="_blank" class="choice-btn ki"><i class="fas fa-bolt"></i> Kick</a>
        </div>
    </div>
</div>

<footer>
    <div class="social-icons">
        <a href="https://twitch.tv/outburstone" target="_blank"><i class="fab fa-twitch"></i></a>
        <a href="https://instagram.com/DEIN_NAME" target="_blank"><i class="fab fa-instagram"></i></a>
        <a href="https://tiktok.com/@DEIN_NAME" target="_blank"><i class="fab fa-tiktok"></i></a>
        <a href="https://x.com/DEIN_NAME" target="_blank"><i class="fab fa-x-twitter"></i></a>
        <a href="https://youtube.com/@DEIN_NAME" target="_blank"><i class="fab fa-youtube"></i></a>
        <a href="https://kick.com/outburstone" target="_blank"><i class="fas fa-bolt"></i></a>
    </div>
    <div><a href="DEIN_LINK" target="_blank" class="legal-link">Impressum & Datenschutz</a></div>
</footer>

<script>
    const toggleSwitch = document.querySelector('#checkbox');
    const currentTheme = localStorage.getItem('theme');
    if (currentTheme) {
        document.documentElement.setAttribute('data-theme', currentTheme);
        if (currentTheme === 'dark') toggleSwitch.checked = true;
    }
    toggleSwitch.addEventListener('change', (e) => {
        const theme = e.target.checked ? 'dark' : 'light';
        document.documentElement.setAttribute('data-theme', theme);
        localStorage.setItem('theme', theme);
    });

    function openModal(activePlatforms, ytLink) {
        document.querySelectorAll('.choice-btn').forEach(b => b.style.display = 'none');
        if (ytLink) document.getElementById('m-youtube').href = ytLink;
        activePlatforms.forEach(p => {
            const el = document.getElementById('m-' + p.trim().toLowerCase());
            if (el) el.style.display = 'flex';
        });
        document.getElementById('multiModal').style.display = "block";
    }
    function closeModal() { document.getElementById('multiModal').style.display = "none"; }
    window.onclick = function(e) { if (e.target == document.getElementById('multiModal')) closeModal(); }

    const SHEET_ID = '1Tqh44T0aVLwoxvql2yN5NRnwAUxtPi_LAYQvV9HWu5U'; 
    const url = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:csv&sheet=Plan`;

    const curr = new Date();
    const diff = curr.getDate() - curr.getDay() + (curr.getDay() === 0 ? -6 : 1); 
    const first = new Date(new Date().setDate(diff));
    const last = new Date(new Date().setDate(diff + 6));
    document.getElementById('week-range').innerText = `${first.toLocaleDateString('de-DE')} - ${last.toLocaleDateString('de-DE')}`;

    fetch(url).then(res => res.text()).then(data => {
        const rows = data.split('\n').slice(1);
        const container = document.getElementById('plan-container');
        container.innerHTML = '';
        
        const heuteVergleich = new Date();
        heuteVergleich.setHours(0,0,0,0);
        let lastDate = "";

        rows.forEach(row => {
            const cols = row.match(/(".*?"|[^",\s]+)(?=\s*,|\s*$)/g) || [];
            const clean = cols.map(c => c.replace(/^"|"$/g, '').trim());
            if (clean.length < 4) return;
            const [tag, datumStr, zeit, titel, spielID, statusRaw, gaeste, link] = clean;
            const status = statusRaw ? statusRaw.toLowerCase() : "";

            if (datumStr !== lastDate) {
                const section = document.createElement('section');
                const parts = datumStr.split('.');
                const termin = new Date(parts[2], parts[1]-1, parts[0]);
                termin.setHours(0,0,0,0);

                if (termin.getTime() === heuteVergleich.getTime()) {
                    section.className = 'today';
                } else if (termin.getTime() < heuteVergleich.getTime()) {
                    section.className = 'past-day';
                }

                section.innerHTML = `<div class="weekday"><h3><span>${tag}</span><div style="font-size:14px;color:var(--accent-blue);font-weight:700;">${datumStr}</div></h3><div class="status-area"></div></div><div class="slots"></div>`;
                container.appendChild(section);
                lastDate = datumStr;
            }

            const currentSection = container.lastElementChild;
            const statusArea = currentSection.querySelector('.status-area');
            const slotsDiv = currentSection.querySelector('.slots');

            let tUrl = "https://twitch.tv/outburstone";
            let yUrl = "https://youtube.com/@DEIN_KANAL/live";
            let kUrl = "https://kick.com/outburstone";

            if (status.includes('live') || status.includes(',') || status === 'all') {
                let btn = document.createElement('a');
                btn.className = 'live-tag-badge';
                let label = "JETZT LIVE";
                let bg = "var(--twitch-color)";
                let platforms = [];

                if (status === 'live') { platforms = ['twitch']; label += "<br>AUF TWITCH"; }
                else if (status === 'live-yt' || (status === "" && link && link.toLowerCase().includes("youtube"))) { 
                    platforms = ['youtube']; label += "<br>AUF YOUTUBE"; bg = "var(--youtube-color)"; 
                }
                else if (status === 'live-kick') { platforms = ['kick']; label += "<br>AUF KICK"; bg = "var(--kick-color)"; btn.style.color="#000"; }
                else {
                    bg = "var(--multi-gradient)";
                    if (status === 'all' || status === 'live-both') platforms = ['twitch', 'youtube', 'kick'];
                    else platforms = status.split(',').map(p => p.trim());
                    
                    label = "JETZT LIVE AUF<br>" + platforms.join(' & ').toUpperCase();
                    btn.onclick = (e) => { e.preventDefault(); openModal(platforms, link); };
                }
                
                if (platforms.length === 1) {
                    btn.href = (platforms[0] === 'youtube' && link ? link : (platforms[0] === 'kick' ? kUrl : tUrl));
                    btn.target = "_blank";
                }

                btn.innerHTML = `<div class="dot"></div><span>${label}</span>`;
                btn.style.background = bg;
                statusArea.appendChild(btn);
            }

            if (status === 'offday') {
                slotsDiv.innerHTML = `<div style="padding:45px;text-align:center;width:100%;font-weight:900;color:#94a3b8;font-size:24px;letter-spacing:1px;">❄️ STREAMFREI ❄️</div>`;
            } else if (!slotsDiv.innerHTML.includes('STREAMFREI')) {
                const finalImgID = (spielID && !isNaN(spielID)) ? spielID : '509658';
                slotsDiv.insertAdjacentHTML('beforeend', `<div class="slot"><img src="https://static-cdn.jtvnw.net/ttv-boxart/${finalImgID}-144x192.jpg"><div class="slot-body"><div class="time-badge">${zeit} Uhr</div><p class="event-title">${titel}</p>${gaeste && gaeste!=='null' ? `<div style="color:var(--accent-blue);font-size:14px;font-weight:700;margin-top:6px;">👥 Heute mit ${gaeste}</div>` : ''}${link && link!=='null' ? `<a href="${link}" target="_blank" style="background:var(--action-color);color:white;text-decoration:none;padding:8px 16px;border-radius:10px;font-size:12px;font-weight:800;margin-top:12px;display:inline-block;transition:0.2s;">📺 VIDEO ANSEHEN</a>` : ''}</div></div>`);
            }
        });
    });
</script>
</body>
</html>
