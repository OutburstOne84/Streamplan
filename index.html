<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Streamplan OutburstOne</title>
    <style>
        :root { 
            --background-gradient-1: #FEF3F7; 
            --background-gradient-2: #FFC7D6; 
            --text-color: #301826; 
            --accent-pink: #F47590; 
            --border-color: #EB6E9C; 
            --date-bg: #FFE4ED;
            --badge-color: #F47590;
            --action-color: #FF5C8A;
        }

        body { 
            margin: 0; font-family: 'Segoe UI', Roboto, sans-serif; 
            background: linear-gradient(180deg, var(--background-gradient-1), var(--background-gradient-2)); 
            min-height: 100vh; color: var(--text-color); padding-bottom: 50px;
        }

        header, main { width: 95%; max-width: 850px; margin: auto; text-align: center; }
        header { padding: 40px 0; }
        h1 { font-size: 45px; color: #301826; margin: 0; }
        h1 span { display: block; font-size: 28px; color: var(--accent-pink); font-weight: normal; }
        #status-msg { font-weight: bold; color: var(--accent-pink); margin-top: 10px; text-transform: uppercase; letter-spacing: 1px; }

        /* DIE TAGES-BOX */
        section { 
            display: flex; 
            margin-top: 30px; 
            border: 2px solid var(--border-color); 
            border-radius: 20px; 
            background-color: white; 
            overflow: hidden; 
            text-align: left;
            box-shadow: 0 6px 20px rgba(0,0,0,0.08);
        }

        .past-day { opacity: 0.5; filter: grayscale(50%); }
        .today { box-shadow: 0 0 35px var(--accent-pink); border: 3px solid var(--accent-pink); transform: scale(1.02); }

        /* LINKES DATUM */
        .weekday { 
            padding: 20px; 
            width: 150px; 
            background-color: var(--date-bg); 
            border-right: 2px solid var(--border-color); 
            display: flex; flex-direction: column; justify-content: center; align-items: center;
        }
        .weekday h3 { margin: 0; color: #301826; text-align: center; }
        .weekday h3 span { display: block; font-size: 24px; font-weight: 900; }
        .datum-text { font-size: 15px; font-weight: bold; color: var(--accent-pink); }

        /* RECHTER INHALT (ALLE EVENTS) */
        .slots { flex: 1; display: flex; flex-direction: column; }
        .slot { 
            display: flex; 
            align-items: center; 
            padding: 20px; 
            border-bottom: 1px solid #f0f0f0; 
        }
        .slot:last-child { border-bottom: none; }
        
        .slot img { width: 65px; height: 85px; object-fit: cover; border-radius: 8px; margin-right: 20px; border: 1px solid #eee; }
        
        .slot-body { flex: 1; }
        .time-badge { background: var(--badge-color); color: white; padding: 3px 10px; border-radius: 8px; font-size: 13px; font-weight: bold; margin-bottom: 5px; display: inline-block; }
        .event-title { margin: 0; color: #301826; font-weight: 800; font-size: 18px; }
        .event-subtitle { display: block; font-weight: normal; font-size: 14px; color: #666; }
        
        .guests { font-size: 13px; color: var(--accent-pink); margin-top: 5px; font-weight: bold; }
        .btn-link { 
            background: var(--action-color); color: white; text-decoration: none; 
            padding: 6px 14px; border-radius: 6px; font-size: 11px; font-weight: bold;
            margin-top: 10px; display: inline-block; transition: 0.2s;
        }
        .btn-link:hover { transform: translateY(-2px); box-shadow: 0 3px 8px rgba(255, 92, 138, 0.4); }

        .offday-text { padding: 40px; text-align: center; width: 100%; font-weight: bold; color: var(--accent-pink); font-size: 18px; }

        @media(max-width: 650px) { 
            section { flex-direction: column; } 
            .weekday { width: 100%; border-right: none; border-bottom: 2px solid var(--border-color); padding: 10px; } 
        }
    </style>
</head>
<body>

<header>
    <h1><span>OutburstOne</span> Streamplan</h1>
    <p id="status-msg">Pläne werden synchronisiert...</p>
</header>

<main id="plan-container"></main>

<script>
    const SHEET_ID = '1Tqh44T0aVLwoxvql2yN5NRnwAUxtPi_LAYQvV9HWu5U'; 
    const url = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:csv&sheet=Plan`;

    fetch(url).then(res => res.text()).then(data => {
        const rows = data.split('\n').slice(1);
        const container = document.getElementById('plan-container');
        container.innerHTML = '';
        const heute = new Date(); heute.setHours(0,0,0,0);

        let lastDate = "";
        let currentSlotsDiv = null;

        rows.forEach(row => {
            const cols = row.match(/(".*?"|[^",\s]+)(?=\s*,|\s*$)/g) || [];
            const clean = cols.map(c => c.replace(/^"|"$/g, '').trim());
            if (clean.length < 5) return;

            const [tag, datumStr, zeit, titel, untertitel, spielID, status, gaeste, link] = clean;

            // FALLS NEUES DATUM -> NEUE BOX
            if (datumStr !== lastDate) {
                const parts = datumStr.split('.');
                const termin = new Date(parts[2], parts[1]-1, parts[0]); termin.setHours(0,0,0,0);

                const section = document.createElement('section');
                if (termin.getTime() === heute.getTime()) section.className = 'today';
                else if (termin.getTime() < heute.getTime()) section.className = 'past-day';

                section.innerHTML = `
                    <div class="weekday">
                        <h3><span>${tag}</span><div class="datum-text">${datumStr}</div></h3>
                    </div>
                    <div class="slots"></div>`;
                container.appendChild(section);
                currentSlotsDiv = section.querySelector('.slots');
                lastDate = datumStr;
            }

            // INHALT IN DIE AKTUELLE BOX EINFÜGEN
            if (status && status.toLowerCase().includes('offday')) {
                currentSlotsDiv.innerHTML = `<div class="offday-text">✨ HEUTE STREAMFREI ✨</div>`;
            } else {
                const guestHTML = gaeste ? `<div class="guests">👥 ${gaeste}</div>` : '';
                const linkHTML = (link && link !== 'null' && link !== '') ? `<a href="${link}" target="_blank" class="btn-link">📺 VIDEO ANSEHEN</a>` : '';
                
                const slotHTML = `
                    <div class="slot">
                        <img src="https://static-cdn.jtvnw.net/ttv-boxart/${spielID || '509658'}-144x192.jpg" onerror="this.src='https://static-cdn.jtvnw.net/ttv-boxart/509658-144x192.jpg'">
                        <div class="slot-body">
                            <div class="time-badge">${zeit} Uhr</div>
                            <p class="event-title">${titel} <span class="event-subtitle">${untertitel}</span></p>
                            ${guestHTML}
                            ${linkHTML}
                        </div>
                    </div>`;
                currentSlotsDiv.insertAdjacentHTML('beforeend', slotHTML);
            }
        });
        document.getElementById('status-msg').innerText = "Deine Woche im Überblick";
    });
</script>
</body>
</html>
